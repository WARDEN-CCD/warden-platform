# Weights are managed by the Argo Rollouts Gateway API plugin during a rollout (ADR-012).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: [[ .Name ]]
  namespace: svc-[[ .Name ]]
spec:
  parentRefs:
    - name: warden
      namespace: envoy-gateway-system
  hostnames:
    - [[ .Name ]].warden.localhost
  rules:
    - backendRefs:
        - name: [[ .Name ]]-stable
          port: 80
          weight: 100
        - name: [[ .Name ]]-canary
          port: 80
          weight: 0
