# DRAFT — encodes ADR-008/009/011/013; not yet run. Spike S1 validates the sign/attest path.
#
# The only workflow whose identity admission trusts (ADR-009). Services call it with:
#   uses: WARDEN-CCD/warden-platform/.github/workflows/build-sign-attest.yml@vX.Y.Z
# Jobs and why they are separate:
#   build       runs project code (Maven, tests, Jib). NO id-token permission → cannot mint a signing cert.
#   scan        SBOM + vulnerability scan of the pushed digest. Tools installed as cosign-verified binaries.
#   sign-attest the only job with id-token: write. Runs NO project code (no checkout).
#   promote     opens a digest-only PR in warden-gitops with a GitHub App token scoped to that repo.
# Pushing, signing and promotion happen only for push events on refs/heads/main.
name: build-sign-attest

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "25"
      gitops-repo:
        type: string
        default: warden-gitops
    secrets:
      WARDEN_PROMOTER_PRIVATE_KEY:
        required: false
    outputs:
      digest:
        description: Image digest pushed on main (empty for PR builds)
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

env:
  COSIGN_VERSION: v3.1.4
  SYFT_VERSION: 1.55.0
  TRIVY_VERSION: 0.76.0

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Test
        run: ./mvnw -B -ntp verify
      - name: Build image tarball (pull requests and non-main refs; nothing is pushed)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: ./mvnw -B -ntp -DskipTests jib:buildTar -Djib.to.image="ghcr.io/${GITHUB_REPOSITORY,,}"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image (main only)
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Jib reads the Docker credential written by docker/login-action; the tag is a human label only.
          ./mvnw -B -ntp -DskipTests jib:build -Djib.to.image="${image}:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat target/jib-image.digest)" >> "$GITHUB_OUTPUT"

  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep CE (ADR-023)
        run: |
          python3 -m pip install --quiet "semgrep==1.182.0"
          semgrep scan --config p/java --config p/secrets --error --metrics=off

  scan:
    needs: build
    if: needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Syft and Trivy as verified binaries (ADR-011)
        # Signer identities observed in spike S1 (hub evidence/spikes/S1.md). Re-check when bumping versions.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          verify() {  # $1 = checksums file, $2 = exact certificate identity
            cosign verify-blob --bundle "$1.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$2" "$1"
            sha256sum --check --ignore-missing "$1"
          }
          t="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLO "$t/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "$t/trivy_${TRIVY_VERSION}_checksums.txt"
          curl -sSfLO "$t/trivy_${TRIVY_VERSION}_checksums.txt.sigstore.json"
          verify "trivy_${TRIVY_VERSION}_checksums.txt" \
            "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v${TRIVY_VERSION}"
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          s="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl -sSfLO "$s/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$s/syft_${SYFT_VERSION}_checksums.txt"
          curl -sSfLO "$s/syft_${SYFT_VERSION}_checksums.txt.sigstore.json"
          verify "syft_${SYFT_VERSION}_checksums.txt" \
            "https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main"
          tar -xzf "syft_${SYFT_VERSION}_linux_amd64.tar.gz" syft
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: SBOM (CycloneDX)
        run: syft "$IMAGE_REF" -o cyclonedx-json=sbom.cdx.json
      - name: Vulnerability report (cosign vuln predicate)
        run: trivy image --format cosign-vuln --output vuln.json "$IMAGE_REF"
      - name: Fail on fixable CRITICAL vulnerabilities (ADR-022)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-predicates
          path: |
            sbom.cdx.json
            vuln.json
          retention-days: 7

  sign-attest:
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      # Deliberately no checkout: this job must not execute project code (ADR-009, threat T11).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation-predicates
      - name: Sign image (keyless)
        run: cosign sign --yes "$IMAGE_REF"
      - name: SLSA v1 provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"
      - name: Vulnerability attestation
        run: cosign attest --yes --type vuln --predicate vuln.json "$IMAGE_REF"

  promote:
    needs: [build, sign-attest]
    runs-on: ubuntu-24.04
    permissions: {}
    concurrency:
      group: promote-${{ github.repository }}
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE: ${{ needs.build.outputs.image }}
      GITOPS_REPO: ${{ inputs.gitops-repo }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.WARDEN_PROMOTER_APP_ID }}
          private-key: ${{ secrets.WARDEN_PROMOTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.gitops-repo }}
      - name: Open digest-only PR in warden-gitops (ADR-013)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"; svc="${repo#svc-}"
          gitops="${GITHUB_REPOSITORY_OWNER}/${GITOPS_REPO}"
          gh repo clone "$gitops" gitops -- --depth 1
          cd gitops
          if [ ! -f "apps/${svc}/rollout.yaml" ]; then
            # First build of a new service: `warden new` registers apps/<svc>/ with this digest itself.
            echo "::notice::apps/${svc}/ not in ${gitops} yet; skipping promotion (warden new registers it)"
            exit 0
          fi
          branch="promote/${svc}/${GITHUB_SHA::12}"
          git switch -c "$branch"
          # Replace exactly the digest of this service's image in its Rollout.
          sed -i -E "s|(${IMAGE}@)sha256:[0-9a-f]{64}|\1${DIGEST}|" "apps/${svc}/rollout.yaml"
          git -c user.name="warden-promoter[bot]" \
              -c user.email="warden-promoter[bot]@users.noreply.github.com" \
              commit -am "deploy(${svc}): ${DIGEST:7:12} from ${GITHUB_SHA::12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${gitops}.git" "$branch"
          gh pr create --repo "$gitops" --head "$branch" --label digest-only \
            --title "deploy(${svc}): ${DIGEST:7:12}" \
            --body "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          gh pr merge --repo "$gitops" --auto --squash "$branch"
